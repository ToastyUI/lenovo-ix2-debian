; ksmbd (SMB3-server in de kernel) voor de ix2. Shares volgen na het RAID (fase 6).
; Aanzetten voor de vergelijkingstest: systemctl stop smbd; systemctl start ksmbd
[global]
	server string = ix2
	workgroup = WORKGROUP
	server min protocol = SMB2_10
	server signing = auto
	smb3 encryption = no
	durable handles = yes
	map to guest = never
	smb2 max read = 4MB
	smb2 max write = 4MB
	smb2 max trans = 4MB
	tcp port = 445

[nasuser]
	path = /srv/nas/nasuser
	valid users = nasuser
	read only = no
	create mask = 0640
	directory mask = 0750
