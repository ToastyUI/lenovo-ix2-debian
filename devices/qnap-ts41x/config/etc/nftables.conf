#!/usr/sbin/nft -f
# LAN-only services; from the internet only WireGuard and the torrent peer port.
# Set LAN to the home subnet.
flush ruleset
define LAN = 192.168.0.0/16
table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    meta l4proto { icmp, ipv6-icmp } accept
    udp dport 51820 accept                                   # WireGuard
    tcp dport 51413 accept                                   # transmission peers
    udp dport 51413 accept
    iifname "wg0" tcp dport 22 accept                        # SFTP photo upload via the tunnel
    ip saddr $LAN tcp dport { 22, 111, 445, 2049, 8200, 9090, 9091 } accept
    ip saddr $LAN udp dport { 111, 1900 } accept             # rpcbind, SSDP (minidlna)
    ip6 saddr fe80::/10 udp dport 1900 accept
  }
  chain forward { type filter hook forward priority 0; policy drop; }
  chain output  { type filter hook output priority 0; policy accept; }
}
