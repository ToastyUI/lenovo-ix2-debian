[Service]
ProtectSystem=strict
ReadWritePaths=/srv/data/Downloads /var/lib/transmission-daemon /etc/transmission-daemon
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
LockPersonality=yes
MemoryMax=96M
Nice=10
IOSchedulingClass=idle
